<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="src/css/login.css">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col">
                <div class="brand"><span>EASE</span><span class="chedule">chedule</span>
                </div>
            </div>
            <div class="row">
                <h1 class="logIn">Login</h1>
            </div>
        </div>
        <div class="row">
            <h5 class="loginDesc">Login to access your account</h5>
        </div>
    </div>
    <div class="container my-4">
        <form>
            <div class="form-group custom-input mb-4">
                <input type="email" id="email" required>
                <label for="email">Email</label>
            </div>

            <div class="form-group custom-input mb-4">
                <input type="password" id="password" required>
                <label for="password">Password</label>
            </div>

            <button type="submit" class="btn btn-primary loginBtn">Login</button>

            <div class="dontHave mt-3">
                <span>Don’t have an account? </span>
                <a href="signup.html"><span class="signUp">Sign up</span></a>
            </div>
        </form>
    </div>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
</body>

</html>
