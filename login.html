<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="src/css/login.css">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-6">
                <div class="brand mb-3">
                    <span>EASE</span><span class="chedule">chedule</span>
                </div>

                <h1 class="logIn">Login</h1>
                <h5 class="loginDescription mb-4">Login to access your account</h5>

                <form>
                    <div class="mb-4 customInput">
                        <input type="email" id="email" class="form-control" placeholder=" " required>
                        <label for="email" class="form-label">Email</label>
                    </div>
                    <div class="mb-4 customInput">
                        <input type="password" id="password" class="form-control" placeholder=" " required>
                        <label for="password" class="form-label">Password</label>
                    </div>
                    <button type="submit" class="btn btn-primary btnLogin">Login</button>
                    <div class="noAccount mt-3">
                        <span>Don’t have an account? </span>
                        <a href="signup.html"><span class="signUp"> Sign up</span></a>
                    </div>
                </form>
            </div>

            <div class="col-6 d-flex align-items-center justify-content-center">
                <div class="card text-center imgCard p-4">
                </div>
            </div>
        </div>
    </div>





    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
</body>

</html>
