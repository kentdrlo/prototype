<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="src/css/signup.css">
</head>

<body>

    <div class="container">
        <div class="row">
            <div class="col-lg-6">
                <div class="card">
                </div>
            </div>
            <div class="col-lg-6">
                <div class="brand"><span>EASE</span><span class="chedule">chedule</span></div>
                <div class="row">
                    <div class="signUp"> Sign up</div>
                </div>
                <div class="row">
                    <div class="signupDesc">Let’s get you all set up so you can access your personal account.</div>
                </div>
                <div class="row">
                    <form>
                        <div class="inputName">
                            <div class="customInput flex-grow-1">
                                <label for="firstname">First Name</label>
                                <input type="text" id="firstname" class="form-control" required>
                            </div>

                            <div class="customInput flex-grow-1">
                                <label for="lastname">Last Name</label>
                                <input type="text" id="lastname" class="form-control" required>
                            </div>
                        </div>
                        <div class="inputTeacher">
                            <div class="customInput flex-grow-1">
                                <label for="email">Email</label>
                                <input type="text" id="email" class="form-control" required>
                            </div>

                            <div class="customInput flex-grow-1">
                                <label for="teachercode">Teacher Code</label>
                                <input type="text" id="teachercode" class="form-control" required>
                            </div>
                        </div>
                        <div class="inputPass customInput">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" id="password" class="form-control" name="password" required>
                        </div>
                        <div class="inputconfirmPass customInput">
                            <label for="confirm password" class="form-label">Confirm Password</label>
                            <input type="password" id="confirmPassword" class="form-control" name="confirmPassword"
                                required>
                        </div>
                    </form>
                    <div class="row">
                        <div class="col-12">
                            <div class="formCheck">
                                <input class="form-check-input" type="checkbox" value="" id="invalidCheck" required>
                                <label class="form-check-label" for="invalidCheck">
                                    I agree to all the <a href="#" class="termsLink">Terms</a> and
                                    <a href="#" class="privacyLink">Privacy Policies</a>
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="col-12">
                        <a href="generate.html"><button type="submit" class="btncreateAccount">Create
                                Account</button></a>
                    </div>
                    <div class="col-12 alreadyHave">
                        Already have an account? <a href="login.html" class="loginLink"> Login </a>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
</body>

</html>
