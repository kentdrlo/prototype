<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="src/css/teachers.css">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col">
                <div class="card profileContainer">
                    <div class="row">
                        <div class="col-2 profileImage">
                            <img src="src/assets/icons/profile.jpg" class="rounded-circle" width="60%">
                        </div>
                        <div class="col-8 profileInfo">
                            <div class="name">John Doe</div>
                            <div class="email">john_doe@gmail.com</div>
                            <div class="teacherCode">TCHR-20250529-001</div>
                        </div>
                        <div class="col-2 profileButtons">
                            <button type="button" class="btn btn-outline-primary" data-bs-toggle="modal"
                                data-bs-target="#exampleModal" data-bs-whatever="@getbootstrap">Edit</button>

                            <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel"
                                aria-hidden="true">
                                <div class="modal-dialog">
                                    <div class="modal-content">
                                        <div class="modal-header">
                                            <h1 class="modal-title fs-5" id="exampleModalLabel">Edit Profile</h1>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal"
                                                aria-label="Close"></button>
                                        </div>
                                        <div class="modal-body text-start">
                                            <form>
                                                <div class="inputName">
                                                    <div class="customInput flex-grow-1">
                                                        <label for="firstname">First Name</label>
                                                        <input type="text" id="firstname" class="form-control" required>
                                                    </div>

                                                    <div class="customInput flex-grow-1">
                                                        <label for="lastname">Last Name</label>
                                                        <input type="text" id="lastname" class="form-control" required>
                                                    </div>
                                                </div>
                                            </form>
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary"
                                                data-bs-dismiss="modal">Cancel</button>
                                            <button type="button" class="btn btn-primary">Save</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <button type="button" class="btn btn-outline-secondary" data-bs-toggle="modal"
                                data-bs-target="#exampleModal1" data-bs-whatever="@getbootstrap">Update</button>

                            <div class="modal fade" id="exampleModal1" tabindex="-1" aria-labelledby="exampleModalLabel"
                                aria-hidden="true">
                                <div class="modal-dialog">
                                    <div class="modal-content">
                                        <div class="modal-header">
                                            <h1 class="modal-title fs-5" id="exampleModalLabel">Update Account</h1>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal"
                                                aria-label="Close"></button>
                                        </div>
                                        <div class="modal-body text-start">
                                            <form>
                                                <div class="inputName">
                                                    <div class="customInput flex-grow-1">
                                                        <label for="firstname">First Name</label>
                                                        <input type="text" id="firstname" class="form-control" required>
                                                    </div>

                                                    <div class="customInput flex-grow-1">
                                                        <label for="lastname">Last Name</label>
                                                        <input type="text" id="lastname" class="form-control" required>
                                                    </div>
                                                </div>
                                                <div class="inputTeacher">
                                                    <div class="customInput flex-grow-1">
                                                        <label for="email">Email</label>
                                                        <input type="text" id="email" class="form-control" required>
                                                    </div>

                                                    <div class="customInput flex-grow-1">
                                                        <label for="teachercode">Teacher Code</label>
                                                        <input type="text" id="teachercode" class="form-control"
                                                            value="TCHR-20250529-001" disabled>
                                                    </div>
                                                </div>
                                                <div class="inputPass customInput">
                                                    <label for="password" class="form-label">Password</label>
                                                    <input type="password" id="password" class="form-control"
                                                        name="password" required>
                                                </div>
                                                <div class="inputconfirmPass customInput">
                                                    <label for="confirm password" class="form-label">Confirm
                                                        Password</label>
                                                    <input type="password" id="confirmPassword" class="form-control"
                                                        name="confirmPassword" required>
                                                </div>
                                            </form>
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary"
                                                data-bs-dismiss="modal">Cancel</button>
                                            <button type="button" class="btn btn-primary">Save</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card subjectContainer">
                    <div class="row">
                        <div class="col">
                            <div class="subject">Preferred subjects</div>
                            <div class="subjectContent">
                                <div class="card subjectOne">
                                    <div class="card-body">
                                        <h5 class="card-title subjectName1">Mathematics</h5>
                                        <h6 class="card-subtitle subjectCode1 mb-2 text-body-secondary">MTH 101</h6>
                                    </div>
                                </div>
                                <div class="card subjectTwo">
                                    <div class="card-body">
                                        <h5 class="card-title subjectName2">Science</h5>
                                        <h6 class="card-subtitle subjectCode2 mb-2 text-body-secondary">SCI 102</h6>
                                    </div>
                                </div>
                                <div class="card subjectThree">
                                    <div class="card-body">
                                        <h5 class="card-title subjectName3">Filipino</h5>
                                        <h6 class="card-subtitle subjectCode3 mb-2 text-body-secondary">FIL 103</h6>
                                    </div>
                                </div>
                                <div class="card subjectFour">
                                    <div class="card-body">
                                        <h5 class="card-title subjectName4">English</h5>
                                        <h6 class="card-subtitle subjectCode4 mb-2 text-body-secondary">ENG 104</h6>
                                    </div>
                                </div>
                                <div class="card subjectFive">
                                    <div class="card-body">
                                        <h5 class="card-title subjectName5">Araling Panlipunan</h5>
                                        <h6 class="card-subtitle subjectCode5 mb-2 text-body-secondary">AP 105</h6>
                                    </div>
                                </div>
                                <div class="card subjectSix">
                                    <div class="card-body">
                                        <h5 class="card-title subjectName6">MAPEH</h5>
                                        <h6 class="card-subtitle subjectCode6 mb-2 text-body-secondary">MAPEH 106</h6>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
</body>

</html>
